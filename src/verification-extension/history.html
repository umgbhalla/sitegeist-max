<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Verification history</title><style>
*{box-sizing:border-box}body{margin:0;font:14px/1.5 system-ui;color:#202127;background:#f5f6f8}header,main{padding:18px}header{background:#fff;border-bottom:1px solid #ddd}h1{font-size:20px;margin:0 0 4px}h2{font-size:15px;margin:20px 0 8px}p{margin:4px 0;color:#60636c}button,input{font:inherit}button{border:1px solid #c5c9d1;background:white;border-radius:6px;padding:7px 10px;cursor:pointer}button:hover{background:#f0f1f4}.primary{background:#242d48;color:white;border-color:#242d48}.danger{color:#a31d2c}label{display:block;margin:8px 0}input[type=date]{width:100%;padding:6px;border:1px solid #c5c9d1;border-radius:5px}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.row>*{flex:1}article{background:#fff;border:1px solid #ddd;border-radius:8px;padding:12px;margin:8px 0;overflow-wrap:anywhere}article h3{font-size:14px;margin:0}small{color:#646872}ul{padding-left:20px;color:#a35c09}#notice{min-height:1.5em}button:focus-visible,input:focus-visible{outline:3px solid #5079db}.activity{padding-left:22px;color:#373c48}.activity li{padding:4px 0}.activity summary{cursor:pointer}pre{white-space:pre-wrap;overflow-wrap:anywhere;max-height:240px;overflow:auto;font:11px/1.5 ui-monospace,monospace}
</style></head><body><header><h1>Verification history</h1><p>Recordings are stored locally in this extension.</p><label><input id="enabled" type="checkbox"> Record new activity</label><label><input id="auto" type="checkbox"> Export each completed recording to Downloads</label></header><main><button id="show-controls">Show page controls</button><div id="notice" role="status"></div><h2>Export recordings</h2><div class="row"><label>From<input id="start" type="date"></label><label>Through<input id="end" type="date"></label></div><div class="row"><button id="export" class="primary">Export range</button><button id="all">Export all</button></div><h2>Saved runs <span id="count"></span></h2><div class="row"><button id="refresh">Refresh</button><button id="clear" class="danger">Delete all</button></div><div id="runs"></div></main><script src="history.js"></script></body></html>
